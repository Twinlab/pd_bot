[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd_bot"
version = "1.0.0"
description = "Discord бот для друзей"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "flake8",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "freezegun",
    "types-pytz",
    "flake8-docstrings",
    "flake8-print",
    "flake8-pyproject",
]

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | data
  | downloads
  | logs
  | check_docstrings\.py
  | check_standards\.py
  | check_typing\.py
  | fix_logging\.py
  | format_code\.py
  | unify_project\.py
  | docstring_template\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["data", "downloads", "logs", ".venv", "venv", "check_docstrings.py", "check_standards.py", "check_typing.py", "fix_logging.py", "format_code.py", "unify_project.py", "docstring_template.py"]

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
exclude = 'data|downloads|logs|venv|\.venv|check_docstrings\.py|check_standards\.py|check_typing\.py|fix_logging\.py|format_code\.py|unify_project\.py|docstring_template\.py'

# Добавляем специальные настройки для модулей из mypy.ini
[[tool.mypy.overrides]]
module = "discord.ext.commands"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "discord"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yt_dlp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning:discord"
]

[tool.flake8]
max-line-length = 100
exclude = ".git,__pycache__,.venv,venv,data,downloads,logs,check_docstrings.py,check_standards.py,check_typing.py,fix_logging.py,format_code.py,unify_project.py,docstring_template.py"
extend-ignore = ["E203", "W503"]
show-source = true
per-file-ignores = """
    tests/*: D100,D101,D102,D103,D104,D105,D106,D107,D200,D201,D202,D203,D204,D205,D206,D207,D208,D209,D210,D211,D212,D213,D214,D215,D300,D301,D400,D401,D402,D403,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415,D416,D417,D418,D419
"""
