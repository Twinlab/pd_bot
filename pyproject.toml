[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pd_bot"
version = "1.0.0"
description = "Discord бот"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "aiohttp",
    "aiosqlite",
    "async-timeout",
    "colorlog",
    "discord.py[voice]>=2.7.1",
    "diskcache",
    "matplotlib",
    "Pillow",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pytz",
    "PyYAML>=6.0.1",
    "typing-extensions",
    "ujson",
    "wavelink>=3.5.2",
    "tortoise-orm",
    "aerich",
]

[tool.setuptools]
packages = ["cogs", "handlers", "utils"]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "freezegun",
    "types-pytz",
]

docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "data",
    "downloads",
    "logs",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = 3.13
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
exclude = 'data|downloads|logs|venv|\.venv|tests'
# Игнорируем ошибки типов в аргументах функций
# Оставляем только необходимые игнорирования для библиотек
disable_error_code = ["arg-type", "union-attr"]

# Добавляем специальные настройки для модулей из mypy.ini
[[tool.mypy.overrides]]
module = "discord.ext.commands"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "discord"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wavelink.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cogs.*"
# Игнорируем ошибки в когах, связанные с discord.py
disable_error_code = ["arg-type", "union-attr", "attr-defined", "override"]

[[tool.mypy.overrides]]
module = "handlers.*"
# Игнорируем ошибки в обработчиках, связанные с discord.py
disable_error_code = ["arg-type", "union-attr", "attr-defined", "override"]

[[tool.mypy.overrides]]
module = "utils.music.*"
# Игнорируем ошибки в музыкальных утилитах
disable_error_code = ["arg-type", "union-attr", "attr-defined", "override"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning:discord"
]

