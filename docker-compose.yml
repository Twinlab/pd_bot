services:
  bot:
    image: ghcr.io/twinlab/pd_bot:latest
    # Для локальной разработки можно раскомментировать build: .
    # build: .
    container_name: pd_bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./assets:/app/assets
      # .env файл пробрасывается автоматически через env_file
    env_file:
      - .env
    environment:
      - BOT_ENVIRONMENT=production
      - TZ=Europe/Moscow
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --label-enable
    env_file:
      - .env
    environment:
      - REPO_USER=${REPO_USER}
      - REPO_PASS=${REPO_PASS}
      - TZ=Europe/Moscow