site_name: PD Bot
site_description: Многофункциональный Discord бот на Python
repo_url: https://github.com/twinlab/pd_bot
repo_name: twinlab/pd_bot

theme:
  name: material
  language: ru
  palette:
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Светлая тема
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ru
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

nav:
  - Главная: index.md
  - Начало работы: getting-started.md
  - Архитектура: architecture.md
  - Команды: commands.md
  - Деплой: deployment.md
  - Стиль кода: style-guide.md
