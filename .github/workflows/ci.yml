name: Python CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"] # Используем только Python 3.13

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev] # Устанавливаем основные и dev-зависимости из pyproject.toml

    - name: Lint with flake8
      run: |
        flake8 cogs handlers utils main.py config/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 cogs handlers utils main.py config/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

    - name: Check formatting with black
      run: |
        black --check cogs handlers utils main.py config/

    - name: Check import order with isort
      run: |
        isort --check-only cogs handlers utils main.py config/

    - name: Type check with mypy
      run: |
        mypy cogs handlers utils main.py config/

    - name: Test with pytest and generate coverage report
      run: |
        pytest --cov=./ --cov-report=xml:coverage/coverage.xml
