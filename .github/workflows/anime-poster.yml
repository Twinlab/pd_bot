name: Anime webhook poster

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Сначала initialize-history, затем preview, затем publish"
        type: choice
        default: preview
        options:
          - initialize-history
          - preview
          - publish
          - scheduled
          - confirm-sent
          - confirm-not-sent

      rating:
        description: "Рейтинг: auto — из конфига; g / s / q / e — для одного запуска"
        type: choice
        default: auto
        options:
          - auto
          - g
          - s
          - q
          - e
      tag:
        description: "Один тег Danbooru, например genshin_impact; пусто — автоподбор"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: anime-webhook-poster
  cancel-in-progress: false

jobs:
  post:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MODE: ${{ inputs.mode || 'scheduled' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check webhook configuration
        if: env.MODE == 'publish' || env.MODE == 'scheduled'
        env:
          ANIME_WEBHOOK_URL: ${{ secrets.ANIME_WEBHOOK_URL }}
        run: |
          python -c 'import os, re; assert re.fullmatch(r"https://discord\.com/api(?:/v\d+)?/webhooks/\d+/[\w-]+", os.environ["ANIME_WEBHOOK_URL"].strip()), "Configure ANIME_WEBHOOK_URL first"'
      - name: Restore history and prepare
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANIME_SCHEDULE: ${{ github.event.schedule }}
          ANIME_RATING: ${{ inputs.rating || 'auto' }}
          ANIME_TAG: ${{ inputs.tag || '' }}
          DANBOORU_LOGIN: ${{ secrets.DANBOORU_LOGIN }}
          DANBOORU_API_KEY: ${{ secrets.DANBOORU_API_KEY }}
        run: python ops/anime_poster.py prepare --mode "$MODE"
      - name: Persist reservation before sending
        if: steps.prepare.outputs.persist == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anime-poster-state-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: .anime-poster/state.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
      - name: Publish to Discord
        if: steps.prepare.outputs.send == 'true'
        env:
          ANIME_WEBHOOK_URL: ${{ secrets.ANIME_WEBHOOK_URL }}
        run: python ops/anime_poster.py send
      - name: Persist result
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.persist == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: anime-poster-state-${{ github.run_id }}-${{ github.run_attempt }}-result
          path: .anime-poster/state.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
