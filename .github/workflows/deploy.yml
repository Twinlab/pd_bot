name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      dependency-artifact-id: ${{ steps.dependencies.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          
      - name: Install dependencies
        run: |
          python -m venv .ci-venv
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
          .ci-venv/bin/python -m pip install --upgrade pip setuptools wheel
          .ci-venv/bin/python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/pd-bot-wheel" .
          for wheel in "$RUNNER_TEMP"/pd-bot-wheel/*.whl; do
            .ci-venv/bin/python -m pip install "${wheel}[dev]"
          done
          .ci-venv/bin/python -m pip check
          .ci-venv/bin/python scripts/dependency_snapshot.py write dependency-snapshot.txt
          
      - name: Run Ruff (Linting)
        run: ruff check .
        
      - name: Run Ruff (Formatting)
        run: ruff format --check .
        
      - name: Run Tests
        run: pytest

      - name: Verify tested dependencies
        run: python scripts/dependency_snapshot.py check dependency-snapshot.txt

      - name: Save tested dependency snapshot
        id: dependencies
        uses: actions/upload-artifact@v7
        with:
          name: dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-snapshot.txt
          if-no-files-found: error

  deploy-docs:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install .[docs]
      - run: mkdocs gh-deploy --force

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v6

      - name: Download tested dependency snapshot
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.test.outputs.dependency-artifact-id }}
          path: .
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_REVISION=${{ github.sha }}
