# Основные настройки Discord бота
channels:
  logging: 1365045098785542224
  anime: 298811309640646666
  twitch: 1113813039083442296
  activity_reports: 573665353327181824
  role_reactions_default: 1366858138153910282

timeouts:
  activity_min_record: 10
  activity_max_record: 172800
  activity_monthly_min_time: 1800
  activity_periodic_save: 300
  log_check_interval: 5
  purge_rate_limit: 10
  giveaway_min_duration: 10
  giveaway_max_duration: 604800

limits:
  max_message_length: 1990
  purge_max_count: 100
  purge_min_count: 1
  links_max_per_user: 5
  activity_items_per_page: 10

colors:
  default: "#0099ff"
  error: "#ff0000"
  success: "#00ff00"
  info: "#ffaa00"
  warning: "#ff8800"
  twitch: "#6441a4"

# Настройки аниме-модуля
anime:
  # Теги для поиска изображений на safebooru.org
  # Можно добавлять/удалять теги по желанию
  tags:
    - "1girl"
    - "school_uniform"
    - "long_hair"
    - "short_hair"
    - "blue_eyes"
    - "brown_eyes"
    - "smile"
    - "blush"
    - "cat_ears"
    - "headphones"
    - "glasses"
    - "purple_hair"
    - "green_eyes"
    - "witch_hat"

  # Теги для исключения из поиска (будут добавлены с префиксом -)
  # Например: "-nude", "-nsfw", "-explicit"
  excluded_tags:
    - "tail"
    - "chibi"
    - "no_humans"
    - "large_breasts"
    - "1boy"
    - "multiple_girls"
    - "pokemon"
    - "digimon"
    - "text"
    - "name_tag"
    - "comic"
    - "wings"
    - "logo"
    - "english_text"
    - "official_art"
    - "non-web_source"
    - "title"
    - "speech_bubble"
    - "child"
  # Максимальное количество тегов для одного запроса (safebooru лимит)
  max_tags_per_request: 6

  # Минимальный рейтинг изображений (safe, questionable, explicit)
  # Для SFW контента используем только "safe"
  rating: "questionable"

  # Настройки времени публикации (в UTC)
  schedule:
    morning_hour: 10
    morning_minute: 0
    evening_hour: 18
    evening_minute: 0

# Настройки музыкального модуля
music:
  # Директория для загрузки файлов
  downloads_dir: "downloads"

  # Опции FFmpeg для воспроизведения
  ffmpeg_options: "-vn -loglevel info -hide_banner"

  # Настройки yt-dlp
  yt_dlp:
    audio_quality: "192"
    audio_codec: "mp3"
    search_limit: 10

# Настройки модуля розыгрышей
giveaway:
  min_duration: 10
  max_duration: 604800  # 7 дней

  # Максимальная длина описания розыгрыша
  max_description_length: 4000

  # Эмодзи для участия в розыгрыше
  participation_emoji: "🎉"

# Настройки Twitch модуля
twitch:
  # Интервал проверки стримов (в секундах)
  check_interval: 180
  # Задержка при первом запуске (в секундах)
  startup_delay: 30
  # Цвет эмбедов Twitch (hex)
  embed_color: "#6441A4"
