# Core Settings
channels:
  logging: 1365045098785542224
  anime: 298811309640646666
  twitch: 1113813039083442296
  activity_reports: 573665353327181824
  role_reactions_default: 1366858138153910282

timeouts:
  activity_min_record: 10
  activity_max_record: 172800
  activity_monthly_min_time: 1800
  activity_periodic_save: 300
  log_check_interval: 5
  purge_rate_limit: 10
  giveaway_min_duration: 10
  giveaway_max_duration: 604800
  admin_purge_threshold: 10
  admin_purge_delete_after: 5
  admin_restart_delay: 0.5
  old_message_delete_delay: 0.5
  update_restart_delay: 1

limits:
  max_message_length: 1990
  purge_max_count: 100
  purge_min_count: 1
  links_max_per_user: 5
  activity_items_per_page: 10
  giveaway_participants_chunk: 1900
  twitch_streamers_chunk: 900
  update_output_max_length: 1900
  logging_buffer_overhead: 10
  discord_api_days_limit: 14
  history_multiplier: 2

colors:
  default: "#0099ff"
  error: "#ff0000"
  success: "#00ff00"
  info: "#ffaa00"
  warning: "#ff8800"
  twitch: "#6441a4"

# Modules
anime:
  max_tags_per_request: 6
  rating: "questionable"
  safebooru_limit: 100
  min_tag_selection: 1
  cache_size: 200 # Количество последних постов для кэширования

  tags:
    - "1girl"
    - "2girls"
    - "genshin_impact"

  excluded_tags:
    - "tail"
    - "chibi"
    - "no_humans"
    - "large_breasts"
    - "1boy"
    - "multiple_girls"
    - "pokemon"
    - "digimon"
    - "text"
    - "name_tag"
    - "comic"
    - "wings"
    - "logo"
    - "english_text"
    - "official_art"
    - "non-web_source"
    - "title"
    - "speech_bubble"
    - "child"
    - "english_commentary"
    - "white_background"

  schedule:
    morning_hour: 10
    morning_minute: 0
    evening_hour: 18
    evening_minute: 0

music:
  lavalink:
    # host / port / password подставляются из .env (LAVALINK_HOST, LAVALINK_PORT,
    # LAVALINK_SERVER_PASSWORD). Здесь указаны только параметры поведения плеера.
    secure: false
    identifier: "MAIN"
    search_limit: 10        # Сколько результатов показывать в /play <текст>
    default_volume: 50      # Громкость по умолчанию для нового плеера (0-1000)
    max_volume: 200         # Верхняя граница для команды /volume
    queue_page_size: 10     # Сколько треков на странице /queue

  voice:
    connection_timeout: 30.0
    inactive_timeout: 300   # Сколько секунд бот ждёт без музыки перед автодисконнектом

giveaway:
  min_duration: 10
  max_duration: 604800
  max_description_length: 4000
  participation_emoji: "🎉"

twitch:
  check_interval: 180
  startup_delay: 30
  embed_color: "#6441A4"

# Commands
fun:
  penis:
    min_length: 0
    max_length: 25
    nuance_chance: 0.10
    nuance_text: "...но есть нюанс, это у тебя в жопе"
    not_found_text: "ошибка, пенис не найден"
    not_found_user_ids:
      - 245874719855738880
      - 475738686185668618
      - 238998472349581312
      - 98468414149914624
      - 586324520718172188
      - 761653522982371338
      - 260706205729554432
      - 313001131376771072
      - 366316899694411788
      - 249243234050506752
      - 759088324119494656
      - 255008594007687168

  deathbattle:
    initial_hp: 100
    turn_delay: 2
    max_event_log: 3
    avatar_size: 128

    damage:
      oneshot_chance: 0.01
      high_damage_chance: 0.41
      medium_damage_chance: 0.61
      oneshot_damage: 100
      high_damage_min: 20
      high_damage_max: 30
      medium_damage_min: 10
      medium_damage_max: 20
      low_damage_min: 1
      low_damage_max: 10

  quotes:
    assets_path: "assets/quotes"
    supported_extensions:
      - ".jpg"
      - ".jpeg"
      - ".png"
      - ".gif"
      - ".webp"
    view_timeout: 300  # 5 минут
    max_folders_in_select: 25  # Discord лимит для select options

activity:
  view_timeout: 86400
  reports:
    chunk_delay: 1

dota:
  match_view_timeout: 180

party:
  initiator_emoji: "👑"           # Эмодзи рядом с инициатором (он автоматически готов)
  min_duration_minutes: 1
  max_duration_minutes: 240       # 4 часа
  min_count: 1
  max_count: 25
  command_cooldown_seconds: 3600  # 1 час между вызовами /party на одного юзера
  button_cooldown_seconds: 60     # Кулдаун между нажатиями кнопок «Готов» / «Не готов»
  dm_send_delay: 0.1              # Между отправкой DM, чтобы не упереться в rate-limit
  finished_message_template: "Пати собрано! {ready_pings} — кто не пришёл, тот пидарас. ({role}: {comment})"
  empty_finished_message: "Никого не собрали в пати на {role} ({comment})."

top_reactions:
  live_top: 10              # Сколько позиций показывать в режимах month / year
  all_time_top: 50          # Сколько позиций показывать в режиме all
  per_page: 10              # Сколько позиций на одной странице пагинации
  content_preview_length: 200  # До какой длины обрезать текст сообщения при сохранении в БД
  preview_inline_length: 80    # Длина превью в embed (короче — компактнее лейаут)
  view_timeout: 300            # Таймаут кнопок пагинации в секундах
  ignore_role_reaction_message: true  # Автоматически исключать сообщение для role-реакций
  ignored_message_ids: []      # Ручной чёрный список id сообщений (через `-` по одному на строку)


update:
  restart_command: "systemctl --user restart discord-bot.service"

