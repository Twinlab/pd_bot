  schedule:
    hour: 12                  # Час запуска wrapped-постов (МСК)
    minute: 2                 # 12:02 — после отчётов по играм (12:00) и реакциям (12:01)
    yearly_month: 12          # Когда постить годовой серверный wrapped
    yearly_day: 31
