# Modules
anime:
  # Источник — Danbooru (лимит Member: 2 «обычных» тега; rating:/score: бесплатны, order: считается).
  # Две стратегии: франшиза -> "<франшиза> order:random rating:X score:>=N" (истинный рандом,
  # девочка проверяется ботом по тегам); базовый тег -> "<1girl|2girls> order:rank rating:X".
  min_score: 50           # score:>=N для франшиза-запроса — главный фильтр качества
  limit: 100              # Сколько постов запрашивать за раз
  cache_size: 2000        # Окно дедупа: последние N постов не повторяются (~2.7 года при 2/день)
  extra_tag_chance: 0.3   # Вероятность уйти в франшиза-запрос вместо базового (0..1)

  # ratings: на каждый запрос берётся один случайный (g — general, s — sensitive).
  ratings:
    - "g"
    - "s"

  # base_tags: ровно один в КАЖДОМ запросе — гарантия, что на картинке есть девочка.
  base_tags:
    - "1girl"
    - "2girls"

  # extra_tags: пул франшиз; с вероятностью extra_tag_chance одна добавляется к запросу.
  extra_tags:
    - "genshin_impact"
    - "persona"
    - "danganronpa"
    - "zenless_zone_zero"

  # Посты, в тегах которых встретится любой из этих, отбрасываются.
  excluded_tags:
    - "guro"
    - "comic"
    - "monochrome"
    - "no_humans"
    - "chibi"
    - "1boy"
    - "pokemon"
    - "digimon"
    - "babydoll"
    - "loli"
    - "flat_chest"
    - "huge_breasts"
  schedule:
    morning_hour: 10
    morning_minute: 0
    evening_hour: 18
    evening_minute: 0

music:
  lavalink:
    # host / port / password подставляются из .env (LAVALINK_HOST, LAVALINK_PORT,
    # LAVALINK_SERVER_PASSWORD). Здесь указаны только параметры поведения плеера.
    secure: false
    identifier: "MAIN"
    search_limit: 10        # Сколько результатов показывать в /play <текст>
    default_volume: 50      # Громкость по умолчанию для нового плеера (0-1000)
    max_volume: 200         # Верхняя граница для команды /volume
    queue_page_size: 10     # Сколько треков на странице /queue

  voice:
    connection_timeout: 30.0
    inactive_timeout: 300   # Сколько секунд бот ждёт без музыки перед автодисконнектом

giveaway:
