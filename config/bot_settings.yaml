# Core Settings
channels:
  logging: 1365045098785542224
  anime: 298811309640646666
  twitch: 1113813039083442296
  activity_reports: 573665353327181824
  role_reactions_default: 1366858138153910282

timeouts:
  activity_min_record: 10
  activity_max_record: 172800
  activity_monthly_min_time: 1800
  activity_periodic_save: 300
  log_check_interval: 5
  purge_rate_limit: 10
  giveaway_min_duration: 10
  giveaway_max_duration: 604800
  admin_purge_threshold: 10
  admin_purge_delete_after: 5
  admin_restart_delay: 0.5
  old_message_delete_delay: 0.5
  update_restart_delay: 1

limits:
  max_message_length: 1990
  purge_max_count: 100
  purge_min_count: 1
  links_max_per_user: 5
  activity_items_per_page: 10
  giveaway_participants_chunk: 1900
  twitch_streamers_chunk: 900
  update_output_max_length: 1900
  logging_buffer_overhead: 10
  discord_api_days_limit: 14
  history_multiplier: 2

colors:
  default: "#0099ff"
  error: "#ff0000"
  success: "#00ff00"
  info: "#ffaa00"
  warning: "#ff8800"
  twitch: "#6441a4"

# Modules
anime:
  max_tags_per_request: 6
  rating: "questionable"
  safebooru_limit: 100
  min_tag_selection: 1
  cache_size: 200 # Количество последних постов для кэширования

  tags:
    - "1girl"
    - "2girls"
    - "genshin_impact"

  excluded_tags:
    - "tail"
    - "chibi"
    - "no_humans"
    - "large_breasts"
    - "1boy"
    - "multiple_girls"
    - "pokemon"
    - "digimon"
    - "text"
    - "name_tag"
    - "comic"
    - "wings"
    - "logo"
    - "english_text"
    - "official_art"
    - "non-web_source"
    - "title"
    - "speech_bubble"
    - "child"
    - "english_commentary"
    - "white_background"

  schedule:
    morning_hour: 10
    morning_minute: 0
    evening_hour: 18
    evening_minute: 0

music:
  downloads_dir: "downloads"
  ffmpeg_options: "-vn -loglevel error -hide_banner -b:a 192k -bufsize 2048k -thread_queue_size 4096 -fflags +genpts -avoid_negative_ts make_zero -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5"

  yt_dlp:
    audio_quality: "192"
    audio_codec: "mp3"
    search_limit: 10
    socket_timeout: 5
    retries: 1
    geo_bypass_country: "RU"

  voice:
    connection_timeout: 30.0

giveaway:
  min_duration: 10
  max_duration: 604800
  max_description_length: 4000
  participation_emoji: "🎉"

twitch:
  check_interval: 180
  startup_delay: 30
  embed_color: "#6441A4"

# Commands
fun:
  penis:
    min_length: 0
    max_length: 25

  deathbattle:
    initial_hp: 100
    turn_delay: 2
    max_event_log: 3
    avatar_size: 128

    damage:
      oneshot_chance: 0.01
      high_damage_chance: 0.41
      medium_damage_chance: 0.61
      oneshot_damage: 100
      high_damage_min: 20
      high_damage_max: 30
      medium_damage_min: 10
      medium_damage_max: 20
      low_damage_min: 1
      low_damage_max: 10

activity:
  view_timeout: 86400
  reports:
    chunk_delay: 1

dota:
  match_view_timeout: 180


update:
  restart_command: "systemctl --user restart discord-bot.service"

